<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Studio · Buzzin</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg?v=bee2"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=bee2"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=bee2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F6F5F2;--panel:#ffffff;--panel2:#F2F1EE;--line:#E7E5E0;--ink:#17161F;--muted:#6E6B76;--accent:#17161F;--accent-soft:#FFF3CC;--ok:#158048;--warn:#b7791f;--bad:#d14343;
  --hd:#7A5600;--hd-soft:#FFF3CC;--sh:#2f7d4f;--sh-soft:#e3f3ea}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.top{flex:none;height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .back{color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.top .title{font-weight:800;font-size:15px;white-space:nowrap}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,50,.14)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(.95)}
.btn:disabled{opacity:.45;cursor:default}
.btn.link{border:0;background:none;color:var(--muted);padding:7px 6px}
.main{flex:1;display:flex;min-height:0}
/* list */
.list{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list .filt{padding:12px 14px;border-bottom:1px solid var(--line)}
.list .filt .seg{width:100%}.list .filt .seg button{flex:1}
.legend{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.items{flex:1;overflow:auto;padding:4px 0 30px}
.grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 16px 6px}
.it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 16px;cursor:pointer;border-left:3px solid transparent}
.it:hover{background:var(--panel2)}
.it.on{background:var(--accent-soft);border-left-color:var(--accent)}
.it .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ed{width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}
.badge.buzzin{background:var(--hd-soft);color:var(--hd)}
.badge.shopify{background:var(--sh-soft);color:var(--sh)}
/* editor */
.edit{width:460px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.edit .head{padding:16px 20px 14px;border-bottom:1px solid var(--line)}
.edit h2{margin:0 0 6px;font-size:18px}
.edit .when{color:var(--muted);font-size:12.5px;margin-top:8px}
.edit .when b{color:var(--ink);font-weight:600}
.fields{flex:1;overflow:auto;padding:6px 20px 30px}
.f{margin-top:16px}
.f label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;margin-bottom:6px}
.f label .chg{font-weight:600;font-size:11px;color:var(--warn)}
.f label .rs{margin-left:auto;font-weight:600;font-size:11.5px;color:var(--muted);cursor:pointer;border:0;background:none;padding:0}
.f label .rs:hover{color:var(--accent)}
.f input,.f textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel2);line-height:1.5}
.f input:focus,.f textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);background:#fff}
.f textarea{resize:vertical;min-height:70px}
.f .hint{color:var(--muted);font-size:11.5px;margin-top:5px}
.toks{margin-top:18px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:var(--panel2)}
.toks b{font-size:12px}
.toks .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tk{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 8px;font-size:12px;cursor:pointer;font-family:ui-monospace,Menlo,monospace}
.tk:hover{border-color:var(--accent);color:var(--accent)}
.toks .hint{color:var(--muted);font-size:11.5px;margin-top:8px}
.foot{flex:none;display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:var(--panel)}
.foot .st{font-size:12px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .st.dirty{color:var(--warn);font-weight:600}
.shop{padding:22px 20px}
.shop .card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel2)}
.shop .card p{margin:0 0 10px}
.shop ol{margin:6px 0 0;padding-left:20px}
/* preview */
.prev{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.prev .bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.prev .subj{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev .subj span{color:var(--muted)}
.prev .stage{flex:1;overflow:auto;display:flex;justify-content:center;padding:18px}
.prev iframe{border:1px solid var(--line);border-radius:12px;background:#fff;width:100%;max-width:760px;height:100%;min-height:600px;box-shadow:0 6px 24px rgba(20,30,50,.08);transition:max-width .2s}
.prev.mobile iframe{max-width:390px}
.prev .test{flex:none;display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
.prev .test input{flex:1;max-width:320px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--panel2)}
.prev .test small{color:var(--muted)}
/* map */
.map{flex:1;overflow:auto;padding:22px 24px 40px}
.map .wrap{max-width:980px;margin:0 auto}
.map .intro{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted)}
.map .intro b{color:var(--ink);font-size:16px}
.flow{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 18px 10px;margin-bottom:16px}
.flow .fh{font-weight:800;font-size:14px;padding:12px 0 8px;display:flex;align-items:center;gap:8px}
.flow .fh small{font-weight:500;color:var(--muted);font-size:12px}
.mrow{display:grid;grid-template-columns:minmax(180px,1fr) 24px minmax(240px,1.3fr);align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.mrow .ev{color:var(--muted)}
.mrow .ar{color:var(--muted);text-align:center}
.mrow .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid;border-radius:9px;padding:6px 11px;font-weight:600;cursor:pointer;font-size:13px;text-align:left}
.chip.buzzin{background:var(--hd-soft);border-color:#F2D57A;color:#7A5600}
.chip.shopify{background:var(--sh-soft);border-color:#a9d6bb;border-style:dashed;color:#1f5e3a}
.chip:hover{filter:brightness(.96)}
.chip .go{font-size:11px;font-weight:600;opacity:.75}
.chip .ed{width:7px;height:7px;border-radius:50%;background:var(--warn)}
@media (max-width:700px){.mrow{grid-template-columns:1fr}.mrow .ar{display:none}.map{padding:14px}}
.empty{margin:auto;color:var(--muted);text-align:center;max-width:380px;padding:30px}
.gate{margin:auto;max-width:420px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
@media (max-width:1100px){.edit{width:400px}.list{width:250px}}
@media (max-width:860px){.top{flex-wrap:wrap;height:auto;padding:10px 12px;row-gap:8px}.top .sp{display:none}#portalLink{font-size:12px;padding:5px 10px}body{overflow:auto}.main{flex-direction:column}.list,.edit{width:100%;border-right:0;border-bottom:1px solid var(--line)}.items{max-height:260px}.prev iframe{min-height:520px}}
.btn{border-radius:10px;color:var(--ink)}.btn.pri{color:#fff}.btn.pri:hover{background:#2C2A36;filter:none}
.seg button.on{box-shadow:0 1px 3px rgba(23,22,31,.10)}
input[type=checkbox]{accent-color:var(--ink)}
::selection{background:rgba(255,194,26,.45)}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="/">← Buzzin</a>
  <div class="title"><img src="/logo.svg?v=bee2" alt="" width="22" height="22" style="vertical-align:-5px;border-radius:6px;margin-right:6px">Email Studio</div>
  <div class="seg" id="view"><button data-v="map">🗺 Email map</button><button data-v="edit">✏️ Edit</button></div>
  <div class="seg" id="stores"></div>
  <div class="sp"></div>
  <a class="btn" href="#" id="portalLink" target="_blank" rel="noopener">🎨 Logo &amp; colors (Portal Studio)</a>
</div>
<div class="map hidden" id="map"></div>
<div class="main" id="main">
  <div class="list">
    <div class="filt">
      <div class="seg" id="filt"><button data-f="all" class="on">All</button><button data-f="buzzin">Buzzin</button><button data-f="shopify">Shopify</button></div>
      <div class="legend"><span class="badge buzzin">Buzzin</span> sent by us — edit here.<br><span class="badge shopify">Shopify</span> sent by Shopify — edit in Shopify.</div>
    </div>
    <div class="items" id="items"></div>
  </div>
  <div class="edit" id="edit"></div>
  <div class="prev" id="prev"></div>
</div>
<div class="gate hidden" id="gate"><h3>Open this from Buzzin</h3><p>Sign in to Buzzin first, then open Email Studio from Returns.</p><a class="btn pri" href="/">Go to Buzzin</a></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const KEY = (() => { try { return localStorage.getItem('ec_key') || ''; } catch (e) { return ''; } })();
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + KEY, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong');
  return j;
}
function toast(msg, bad) { const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const store_get = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
const store_set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

let VIEW = 'map', STORE = 'lb', DATA = null, CUR = null, EDITS = {}, FILTER = 'all', ADMIN = false, lastField = null, prevTimer = null, MOBILE = false;
const SENDER = { buzzin: 'Buzzin', shopify: 'Shopify' };
const badge = (s) => `<span class="badge ${s}">${SENDER[s]}</span>`;
const fmtWhen = (d) => new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

function email() { return DATA.emails.find((e) => e.kind === CUR); }
function dirty() { const e = email(); if (!e || e.sender !== 'buzzin') return false; return e.fields.some((f) => (EDITS[f.k] ?? e.copy[f.k] ?? '') !== (e.copy[f.k] ?? '')); }
function value(f) { const e = email(); return EDITS[f.k] ?? e.copy[f.k] ?? ''; }

async function load(keepKind) {
  try { DATA = await api(`/api/emails/${STORE}`); } catch (e) { $('edit').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  ADMIN = DATA.admin;
  $('stores').innerHTML = Object.entries(DATA.stores).map(([k, s]) => `<button data-s="${k}" class="${k === STORE ? 'on' : ''}">${esc(s.name)}</button>`).join('');
  $('portalLink').href = `/returns-studio?store=${STORE}`;
  const want = keepKind || store_get('es_kind', 'return_created');
  CUR = DATA.emails.some((e) => e.kind === want) ? want : DATA.emails[0].kind;
  EDITS = {}; renderList(); renderEdit(); renderPrev(); renderMap(); setView(VIEW);
}
const FLOW_ICON = { Returns: '↩️', Claims: '🧾', 'Order edits': '✏️', 'All emails': '✉️' };
function renderMap() {
  const flows = [];
  for (const e of [...DATA.emails].sort((a, b) => a.step - b.step)) { let f = flows.find((x) => x.n === e.group); if (!f) flows.push(f = { n: e.group, rows: [] }); let r = f.rows.find((x) => x.ev === e.event); if (!r) f.rows.push(r = { ev: e.event, list: [] }); r.list.push(e); }
  const order = ['Returns', 'Claims', 'Order edits', 'All emails']; flows.sort((a, b) => order.indexOf(a.n) - order.indexOf(b.n));
  const chip = (e) => `<button class="chip ${e.sender}" data-open="${e.kind}" title="${esc(e.sender === 'shopify' ? 'Sent by Shopify — see where to edit it' : 'Sent by Buzzin — click to edit')}">${e.sender === 'shopify' ? '🛍' : '✉️'} ${esc(e.name.replace(/ \(Shopify\)$/, '').replace(/^Claim approved — /, 'Approved: '))}${e.edited ? '<span class="ed" title="Edited"></span>' : ''}<span class="go">${e.sender === 'shopify' ? 'Shopify' : 'Edit →'}</span></button>`;
  const hd = DATA.emails.filter((e) => e.sender === 'buzzin').length, sh = DATA.emails.length - hd;
  $('map').innerHTML = `<div class="wrap"><div class="intro"><b>Every customer email for ${esc(DATA.stores[STORE].name)}</b><span class="badge buzzin">Buzzin · ${hd}</span><span class="badge shopify">Shopify · ${sh}</span><span>Click an email to edit it.</span></div>
    ${flows.map((f) => `<div class="flow"><div class="fh">${FLOW_ICON[f.n] || ''} ${esc(f.n)}<small>${f.n === 'All emails' ? 'shared by every Buzzin email' : 'what happens → email the customer gets'}</small></div>
      ${f.rows.map((r) => `<div class="mrow"><span class="ev">${esc(r.ev)}</span><span class="ar">→</span><span class="chips">${r.list.map(chip).join('')}</span></div>`).join('')}</div>`).join('')}</div>`;
}
function setView(v) {
  VIEW = v; store_set('es_view', v);
  $('map').classList.toggle('hidden', v !== 'map'); $('main').classList.toggle('hidden', v === 'map');
  document.querySelectorAll('#view button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'edit' && $('frame') && !$('frame').srcdoc) preview();
}
function renderList() {
  const groups = [];
  for (const e of DATA.emails) { if (FILTER !== 'all' && e.sender !== FILTER) continue; let g = groups.find((x) => x.n === e.group); if (!g) groups.push(g = { n: e.group, list: [] }); g.list.push(e); }
  $('items').innerHTML = groups.map((g) => `<div class="grp">${esc(g.n)}</div>` + g.list.map((e) =>
    `<button class="it ${e.kind === CUR ? 'on' : ''}" data-k="${e.kind}" title="${esc(e.when)}"><span class="nm">${esc(e.name.replace(/ \(Shopify\)$/, ''))}</span>${e.edited ? '<span class="ed" title="Edited"></span>' : ''}${badge(e.sender)}</button>`).join('')).join('') || '<div class="empty">Nothing here.</div>';
}
function renderEdit() {
  const e = email();
  const head = `<div class="head"><div style="display:flex;align-items:center;gap:10px"><h2>${esc(e.name.replace(/ \(Shopify\)$/, ''))}</h2>${badge(e.sender)}</div>
    <div class="when"><b>When it's sent:</b> ${esc(e.when)}</div>${e.shows ? `<div class="when">${esc(e.shows)}</div>` : ''}</div>`;
  if (e.sender === 'shopify') {
    $('edit').innerHTML = head + `<div class="shop"><div class="card"><p><b>Shopify sends this email, not Buzzin.</b></p><p>Its wording and design are changed in Shopify, so they can't be edited here.</p>
      <ol><li>Open Shopify Admin for ${esc(DATA.stores[STORE].name)}</li><li>Settings → Notifications → Customer notifications</li><li>Edit <b>${esc(e.shopify_template)}</b></li></ol></div></div>`;
    return;
  }
  const field = (f) => {
    const v = value(f), def = e.defaults[f.k] ?? '', changed = v !== def;
    const input = f.type === 'text' ? `<input type="text" data-f="${f.k}" value="${esc(v)}" ${ADMIN ? '' : 'readonly'}>` : `<textarea data-f="${f.k}" rows="${f.rows || 4}" ${ADMIN ? '' : 'readonly'}>${esc(v)}</textarea>`;
    return `<div class="f"><label>${esc(f.label)}${changed ? '<span class="chg">edited</span>' : ''}${changed && ADMIN ? `<button class="rs" data-reset="${f.k}">Use default</button>` : ''}</label>${input}
      ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}${f.type === 'rich' ? '<div class="hint">**bold** · [link text](https://…) · blank line = new paragraph</div>' : ''}${f.type === 'lines' ? '<div class="hint">One step per line. **bold** works too.</div>' : ''}</div>`;
  };
  $('edit').innerHTML = head + `<div class="fields">${ADMIN ? '' : '<div class="when" style="margin-top:14px">Only admins can change emails. You can preview them.</div>'}${e.fields.map(field).join('')}
    ${e.tokens.length ? `<div class="toks"><b>Fill-in fields</b><div class="row">${e.tokens.map((t) => `<button class="tk" data-tok="${t.k}" title="${esc(t.d)}">{${t.k}}</button>`).join('')}</div><div class="hint">Click one to add it where your cursor is. Hover to see what it fills in.</div></div>` : ''}</div>
    <div class="foot"><div class="st" id="st"></div>${ADMIN ? `<button class="btn link" id="resetAll">Reset to default</button><button class="btn" id="discard">Discard</button><button class="btn pri" id="save">Save</button>` : ''}</div>`;
  status();
}
function status() {
  const e = email(); if (!e || e.sender !== 'buzzin' || !$('st')) return;
  const d = dirty();
  $('st').className = 'st' + (d ? ' dirty' : '');
  $('st').textContent = d ? 'Unsaved changes — preview shows them' : e.updated_at ? `Live · saved by ${e.updated_by || 'staff'} ${fmtWhen(e.updated_at)}` : e.edited ? 'Live · edited' : 'Live · using the default wording';
  if ($('save')) $('save').disabled = !d; if ($('discard')) $('discard').disabled = !d;
  if ($('resetAll')) $('resetAll').disabled = !e.edited && !Object.keys(EDITS).length;
}
function renderPrev() {
  const e = email();
  if (e.sender === 'shopify') { $('prev').className = 'prev'; $('prev').innerHTML = `<div class="empty">${badge('shopify')}<p>No preview here — Shopify shows its own preview when you edit <b>${esc(e.shopify_template)}</b> in Shopify Admin.</p></div>`; return; }
  $('prev').className = 'prev' + (MOBILE ? ' mobile' : '');
  $('prev').innerHTML = `<div class="bar"><div class="subj" id="subj"><span>Subject:</span> …</div><div class="seg" id="dev"><button data-d="0" class="${MOBILE ? '' : 'on'}">Desktop</button><button data-d="1" class="${MOBILE ? 'on' : ''}">Mobile</button></div></div>
    <div class="stage"><iframe id="frame" title="Email preview"></iframe></div>
    <div class="test">${ADMIN ? `<input type="email" id="to" placeholder="you@example.com" value="${esc(store_get('es_to', ''))}"><button class="btn" id="send">Send test</button><small>Uses a sample order and your unsaved changes.</small>` : '<small>Preview uses a sample order.</small>'}</div>`;
  preview();
}
async function preview() {
  const e = email(); if (e.sender !== 'buzzin') return;
  const copy = {}; for (const f of e.fields) copy[f.k] = value(f);
  try { const r = await api(`/api/emails/${STORE}/preview`, { method: 'POST', body: JSON.stringify({ kind: e.kind, copy }) });
    if (CUR !== e.kind) return;
    $('subj').innerHTML = `<span>Subject:</span> ${esc(r.subject)}`;
    const fr = $('frame'), y = fr.contentWindow ? fr.contentWindow.scrollY : 0;
    fr.srcdoc = r.html; fr.onload = () => { try { fr.contentWindow.scrollTo(0, y); } catch (_) {} };
  } catch (err) { $('subj').textContent = err.message; }
}
function schedulePreview() { clearTimeout(prevTimer); prevTimer = setTimeout(preview, 350); }
function pick(kind) {
  if (kind === CUR) return;
  if (dirty() && !confirm('You have unsaved changes to this email. Leave without saving?')) return;
  CUR = kind; EDITS = {}; store_set('es_kind', kind); renderList(); renderEdit(); renderPrev();
}
async function save() {
  const e = email(), copy = {}; for (const f of e.fields) copy[f.k] = value(f);
  $('save').disabled = true;
  try { await api(`/api/emails/${STORE}/${e.kind}`, { method: 'PUT', body: JSON.stringify({ copy }) }); toast('Saved — live for ' + DATA.stores[STORE].name); await load(e.kind); }
  catch (err) { toast(err.message, true); status(); }
}
async function resetAll() {
  const e = email();
  if (!confirm(`Put "${e.name}" back to the default wording for ${DATA.stores[STORE].name}?`)) return;
  try { await api(`/api/emails/${STORE}/${e.kind}`, { method: 'PUT', body: JSON.stringify({ copy: {} }) }); toast('Back to default'); await load(e.kind); } catch (err) { toast(err.message, true); }
}
async function sendTest() {
  const to = $('to').value.trim(); if (!to) { toast('Enter your email', true); return; }
  store_set('es_to', to);
  const e = email(), copy = {}; for (const f of e.fields) copy[f.k] = value(f);
  $('send').disabled = true; $('send').textContent = 'Sending…';
  try { await api(`/api/emails/${STORE}/test`, { method: 'POST', body: JSON.stringify({ kind: e.kind, copy, to }) }); toast('Test sent to ' + to); }
  catch (err) { toast(err.message, true); }
  $('send').disabled = false; $('send').textContent = 'Send test';
}

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.v) { setView(t.dataset.v); return; }
  if (t.dataset.open) { const k = t.dataset.open; if (k !== CUR) { if (dirty() && !confirm('You have unsaved changes to this email. Leave without saving?')) return; CUR = k; EDITS = {}; store_set('es_kind', k); renderList(); renderEdit(); renderPrev(); } setView('edit'); return; }
  if (t.dataset.s && t.dataset.s !== STORE) { if (dirty() && !confirm('You have unsaved changes. Switch store without saving?')) return; STORE = t.dataset.s; store_set('es_store', STORE); load(CUR); }
  else if (t.dataset.f && t.closest('#filt')) { FILTER = t.dataset.f; document.querySelectorAll('#filt button').forEach((b) => b.classList.toggle('on', b === t)); renderList(); }
  else if (t.dataset.k) pick(t.dataset.k);
  else if (t.dataset.d != null && t.closest('#dev')) { MOBILE = t.dataset.d === '1'; $('prev').classList.toggle('mobile', MOBILE); document.querySelectorAll('#dev button').forEach((b) => b.classList.toggle('on', b === t)); }
  else if (t.dataset.reset) { const e = email(); EDITS[t.dataset.reset] = e.defaults[t.dataset.reset] ?? ''; renderEdit(); schedulePreview(); }
  else if (t.dataset.tok) {
    const el = lastField && document.body.contains(lastField) ? lastField : document.querySelector('.fields [data-f="intro"]') || document.querySelector('.fields [data-f]');
    if (!el || el.readOnly) return;
    const s = el.selectionStart ?? el.value.length, en = el.selectionEnd ?? s, ins = `{${t.dataset.tok}}`;
    el.value = el.value.slice(0, s) + ins + el.value.slice(en); el.focus(); el.selectionStart = el.selectionEnd = s + ins.length;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
  else if (t.id === 'save') save();
  else if (t.id === 'discard') { EDITS = {}; renderEdit(); preview(); }
  else if (t.id === 'resetAll') resetAll();
  else if (t.id === 'send') sendTest();
});
document.addEventListener('focusin', (ev) => { if (ev.target.dataset && ev.target.dataset.f && ev.target.closest('.fields')) lastField = ev.target; });
document.addEventListener('input', (ev) => {
  const el = ev.target; if (!el.dataset || !el.dataset.f || !el.closest('.fields')) return;
  EDITS[el.dataset.f] = el.value; status(); schedulePreview();
  const e = email(), f = e.fields.find((x) => x.k === el.dataset.f), lab = el.parentElement.querySelector('label');
  if (f && lab) { const changed = el.value !== (e.defaults[f.k] ?? ''); const c = lab.querySelector('.chg'); if (changed && !c) lab.insertAdjacentHTML('beforeend', '<span class="chg">edited</span>'); if (!changed && c) c.remove(); }
});
window.addEventListener('beforeunload', (ev) => { if (dirty()) { ev.preventDefault(); ev.returnValue = ''; } });
document.addEventListener('keydown', (ev) => { if ((ev.metaKey || ev.ctrlKey) && ev.key === 's') { ev.preventDefault(); if ($('save') && !$('save').disabled) save(); } });

(function start() {
  if (!KEY) { $('main').classList.add('hidden'); $('map').classList.add('hidden'); $('view').classList.add('hidden'); document.querySelector('.top .seg').classList.add('hidden'); $('gate').classList.remove('hidden'); return; }
  const q = new URLSearchParams(location.search);
  STORE = ['lb', 'lbo'].includes(q.get('store')) ? q.get('store') : store_get('es_store', 'lb');
  if (q.get('email')) store_set('es_kind', q.get('email'));
  VIEW = q.get('email') ? 'edit' : store_get('es_view', 'map');
  load();
})();
</script>
