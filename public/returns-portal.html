<style>
/* Every look-and-feel value comes from the theme (Buzzin → Returns → Customize portal) as a CSS variable.
   Paired sizes have a desktop (-d) and mobile (-m) value; the active one is picked below 768px. */
:root{
  --h1:var(--h1-d);--h2:var(--h2-d);--fs:var(--body-d);--small:var(--small-d);--logo-h:var(--logo-h-d);
  --card-pad:var(--card-pad-d);--page-pad:var(--page-pad-d);--btn-h:var(--btn-h-d);--bg-img:var(--bg-img-d);
}
@media (max-width:767px){:root{
  --h1:var(--h1-m);--h2:var(--h2-m);--fs:var(--body-m);--small:var(--small-m);--logo-h:var(--logo-h-m);
  --card-pad:var(--card-pad-m);--page-pad:var(--page-pad-m);--btn-h:var(--btn-h-m);--bg-img:var(--bg-img-m);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{position:relative;margin:0;min-height:100vh;min-height:100dvh;font-family:var(--body-font);font-weight:var(--body-weight);font-size:var(--fs);line-height:var(--lh);color:var(--text);background:var(--bg-color);-webkit-font-smoothing:antialiased}
a{color:var(--link)}
h1,h2,h3{font-family:var(--heading-font);color:var(--heading);font-weight:var(--heading-weight);letter-spacing:var(--heading-tracking);text-transform:var(--heading-case)}
h1{font-size:var(--h1);line-height:1.2;margin:0 0 8px}
h2.label{font-size:var(--h2);font-weight:700;margin:28px 0 10px;color:var(--muted);text-transform:var(--label-case);letter-spacing:.06em;font-family:var(--body-font)}
.hidden{display:none!important}

/* background layers */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg-color)}
body.bg-scroll .bg{position:absolute;min-height:100%}
body.mode-gradient .bg{background:linear-gradient(var(--grad-angle),var(--grad-from),var(--grad-to))}
.bg-img{position:absolute;inset:calc(var(--bg-blur) * -2);background-image:var(--bg-img);background-position:var(--focal);background-size:var(--bg-fit);background-repeat:no-repeat;filter:blur(var(--bg-blur))}
body.fit-repeat .bg-img{background-repeat:repeat;background-size:auto}
body:not(.mode-image) .bg-img{display:none}
.bg-ov{position:absolute;inset:0;background:var(--ov)}

/* announcement + header */
.announce{position:relative;z-index:3;background:var(--ann-bg);color:var(--ann-color);text-align:center;font-size:var(--small);padding:9px 16px}
.announce a{color:inherit;font-weight:600}
.topbar{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px var(--page-pad);background:var(--hdr-bg);color:var(--hdr-text)}
body.hdr-border .topbar{border-bottom:1px solid var(--border)}
body.hdr-sticky .topbar{position:sticky;top:0}
.topbar a{color:inherit;text-decoration:none;font-size:var(--small);font-weight:600}
.topbar .brandname{font-family:var(--heading-font);font-weight:var(--heading-weight);font-size:calc(var(--fs) * 1.15)}

/* page layout */
.page{position:relative;z-index:1;min-height:calc(100vh - var(--chrome-h, 0px));display:flex;padding:var(--page-pad)}
body.valign-center .page{align-items:center}
body.valign-top .page{align-items:flex-start}
body.lay-center .page{justify-content:center}
body.lay-left .page{justify-content:flex-start}
body.lay-right .page{justify-content:flex-end}
.shell{width:100%;max-width:var(--card-w);display:flex;flex-direction:column;gap:16px}
.card{background:var(--card-bg);border:var(--card-border) solid var(--border);border-radius:var(--radius);padding:var(--card-pad);box-shadow:var(--shadow);backdrop-filter:blur(var(--glass));-webkit-backdrop-filter:blur(var(--glass))}

/* split layout: image on one side, form on the other */
body.lay-split .bg{display:none}
body.lay-split .page{padding:0;align-items:stretch}
.media{display:none}
body.lay-split .media{display:block;position:sticky;top:0;height:100vh;flex:0 0 var(--split-w);overflow:hidden;background:var(--bg-color)}
body.lay-split.mode-gradient .media{background:linear-gradient(var(--grad-angle),var(--grad-from),var(--grad-to))}
body.lay-split .media .bg-img{display:block}
body.lay-split:not(.mode-image) .media .bg-img{display:none}
body.lay-split.split-right .page{flex-direction:row-reverse}
body.lay-split .formside{flex:1;display:flex;justify-content:center;padding:var(--page-pad);background:var(--card-bg)}
body.lay-split.valign-center .formside{align-items:center}
body.lay-split .card{background:transparent;border:0;box-shadow:none;padding:0;backdrop-filter:none}
body:not(.lay-split) .formside{display:contents}

@media (max-width:767px){
  body.lay-left .page,body.lay-right .page{justify-content:center}
  body.card-full-m .page{padding:0;align-items:stretch}
  body.card-full-m .card{border-radius:0;border-left:0;border-right:0;min-height:100%}
  body.card-full-m .foot,body.card-full-m .pagelogo{padding:0 16px}
  body.lay-split .page{flex-direction:column!important}
  body.lay-split .media{position:relative;height:200px;flex:0 0 auto;width:100%}
}

/* logo */
.logo{display:block;height:var(--logo-h);width:auto;max-width:100%;object-fit:contain}
.logowrap{display:flex;justify-content:var(--logo-justify);margin-bottom:20px}
.logowrap a{display:inline-flex}
.pagelogo{display:flex;justify-content:var(--logo-justify)}
.storename{font-family:var(--heading-font);font-weight:var(--heading-weight);color:var(--heading);font-size:calc(var(--h1) * .8)}

/* step indicator */
.steps{display:flex;gap:6px;list-style:none;margin:0 0 22px;padding:0;counter-reset:s}
.steps li{flex:1;font-size:calc(var(--small) * .92);color:var(--muted);counter-increment:s;display:flex;flex-direction:column;gap:6px}
.steps li::before{content:"";height:4px;border-radius:4px;background:var(--border)}
.steps li.past::before,.steps li.on::before{background:var(--primary)}
.steps li.on{color:var(--heading);font-weight:600}
@media (max-width:420px){.steps li span{display:none}}

/* text */
.lead{color:var(--muted);margin:0 0 22px}
.muted{color:var(--muted);font-size:var(--small)}
.rich a{color:var(--link)}

/* forms */
label.f{display:block;font-size:var(--small);font-weight:600;margin:0 0 6px}
.help{font-size:calc(var(--small) * .92);color:var(--muted);margin-top:5px}
.row{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;font:inherit;font-size:max(16px,var(--fs));color:var(--input-text);background:var(--input-bg);border:var(--in-bw) solid var(--input-border);border-radius:var(--in-radius);padding:0 14px;min-height:var(--in-h);outline:none;transition:border-color .15s,box-shadow .15s}
textarea{padding:12px 14px;min-height:72px;resize:vertical}
select{padding-right:34px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
body.in-filled input,body.in-filled select,body.in-filled textarea{background-color:var(--soft);border-color:transparent}
body.in-underline input,body.in-underline select,body.in-underline textarea{border-width:0 0 var(--in-bw) 0;border-radius:0;background-color:transparent;padding-left:2px}
input:focus,select:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px var(--focus-ring)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--btn-h);padding:0 26px;border-radius:var(--btn-radius);font:inherit;font-size:var(--btn-fs);font-weight:var(--btn-weight);text-transform:var(--btn-case);letter-spacing:var(--btn-tracking);cursor:pointer;text-decoration:none;border:2px solid var(--primary);background:var(--primary);color:var(--on-primary);transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(.92)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
body.btn-outline .btn{background:transparent;color:var(--primary)}
body.btn-soft .btn{background:var(--soft);border-color:var(--soft);color:var(--primary)}
body.btn-full .btn.main{width:100%}
body.btn-shadow .btn{box-shadow:0 6px 16px -6px var(--primary)}
.stepnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.stepnav:empty{display:none}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:calc(var(--btn-h) - 10px);padding:0 18px;border-radius:var(--btn-radius);border:1.5px solid var(--border);background:transparent;color:var(--heading);font:inherit;font-size:var(--small);font-weight:600;cursor:pointer;text-decoration:none}
.btn2:hover{border-color:var(--primary)}
.btn2.quiet{border-color:transparent;color:var(--muted);text-decoration:underline;padding:0 4px}
.shoplink{display:inline-flex;align-items:center;gap:6px;margin-bottom:6px;font-weight:600;text-decoration:none}
.logobtn{background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:var(--small);color:var(--link);text-decoration:underline;cursor:pointer}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* messages */
.err{color:var(--error);background:var(--error-bg);border-radius:var(--in-radius);padding:10px 14px;margin-bottom:16px;font-size:var(--small)}
.note{background:var(--soft);border-radius:var(--in-radius);padding:12px 14px;margin-bottom:10px;font-size:var(--small)}

/* items */
.item{display:grid;grid-template-columns:var(--img-col) 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--border)}
.item:first-child{border-top:0;padding-top:0}
body.noimg .item{grid-template-columns:1fr}
body.noimg .item .thumb{display:none}
.thumb{width:var(--img-size);height:var(--img-size);border-radius:var(--img-radius);object-fit:cover;background:var(--soft);display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:calc(var(--img-size) * .3)}
.item .t{font-weight:600;color:var(--heading)}
.item .v{color:var(--muted);font-size:var(--small)}
.item.off{opacity:.55}
.pick{display:flex;align-items:center;gap:10px;margin-top:8px;cursor:pointer;font-size:var(--small)}
.pick input{width:20px;height:20px;accent-color:var(--primary);margin:0}
.detail{margin-top:12px;display:grid;gap:10px}
.detail .g{display:grid;grid-template-columns:92px 1fr;gap:10px}
.tag{display:inline-block;font-size:calc(var(--small) * .9);background:var(--soft);border-radius:999px;padding:2px 10px;color:var(--muted);margin-top:6px}

/* refund options */
.opt{display:block;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:12px;cursor:pointer;background:var(--input-bg)}
.opt.sel{border-color:var(--primary);box-shadow:0 0 0 3px var(--focus-ring)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.opt .amt{font-weight:700;font-size:calc(var(--fs) * 1.12);white-space:nowrap;color:var(--heading)}
.badge{background:var(--badge-bg);color:var(--badge-text);font-size:calc(var(--small) * .85);font-weight:700;border-radius:999px;padding:2px 9px;margin-left:6px;white-space:nowrap}
.box{border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;background:var(--input-bg)}
.sum{display:flex;justify-content:space-between;gap:10px;font-size:var(--small);color:var(--muted);padding:3px 0}
.sum.total{color:var(--heading);font-weight:700;font-size:var(--fs);border-top:1px solid var(--border);margin-top:8px;padding-top:10px}

/* done */
.done{text-align:center}
.check{width:64px;height:64px;border-radius:50%;background:var(--success);color:#fff;display:grid;place-items:center;margin:4px auto 12px;font-size:30px}
.done ol{text-align:left;margin:20px 0 0;padding-left:20px}
.done ol li{margin-bottom:8px}

/* footer */
.foot{text-align:center;color:var(--page-text);font-size:var(--small)}
.foot a{color:inherit}
.foot .links{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;margin-top:6px}
body.lay-split .foot{color:var(--muted)}

/* options menu */
.mopts{display:grid;gap:10px}
.mopt{display:grid;grid-template-columns:44px 1fr 18px;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--text);background:var(--input-bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .05s}
.mopt:hover:not(:disabled){border-color:var(--primary);box-shadow:0 0 0 3px var(--focus-ring)}
.mopt:active:not(:disabled){transform:translateY(1px)}
.mopt:disabled{cursor:default;opacity:.6}
.mopt .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--primary)}
.mopt .ic svg{width:22px;height:22px}
.mopt .mt{font-weight:700;color:var(--heading);display:block}
.mopt .ms{display:block;color:var(--muted);font-size:var(--small);margin-top:2px}
.mopt .why{display:inline-block;margin-top:6px;font-size:calc(var(--small) * .9);background:var(--soft);border-radius:999px;padding:2px 10px;color:var(--muted)}
.mopt .chev{color:var(--muted)}
/* edit + claims */
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--border);border-radius:999px;overflow:hidden}
.qty button{width:36px;height:34px;border:0;background:transparent;font:inherit;font-size:18px;color:var(--heading);cursor:pointer}
.qty button:disabled{opacity:.35;cursor:default}
.qty span{min-width:28px;text-align:center;font-weight:700}
.eline{display:grid;grid-template-columns:var(--img-col) 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--border)}
.eline:first-child{border-top:0;padding-top:0}
body.noimg .eline{grid-template-columns:1fr}body.noimg .eline .thumb{display:none}
.eline .ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.eline .ctl select{width:auto;min-width:140px;flex:1}
.eline.gone .t{text-decoration:line-through;color:var(--muted)}
.pill{display:inline-block;font-size:calc(var(--small) * .88);font-weight:700;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--muted)}
.pill.warn{background:var(--error-bg);color:var(--error)}
.pill.ok{background:var(--soft);color:var(--success)}
.sres{display:grid;gap:8px;margin-top:10px}
.sres .r{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;padding:10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--input-bg)}
.sres .r img,.sres .r .ph{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--soft)}
.sres .r .row2{display:flex;gap:8px;margin-top:8px}
.sres .r select{min-height:38px}
.btn.sm{min-height:38px;padding:0 16px;font-size:var(--small)}
.timer{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--heading)}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.photos .p{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--soft)}
.photos .p img{width:100%;height:100%;object-fit:cover}
.photos .p button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.photos .p .up{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.6)}
.photos label.add{width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--border);display:grid;place-items:center;text-align:center;font-size:calc(var(--small) * .9);color:var(--muted);cursor:pointer;padding:6px}
.photos label.add:hover{border-color:var(--primary);color:var(--primary)}
.trk{border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;background:var(--input-bg);margin-bottom:10px}
.trk .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.trk .st{font-weight:700;color:var(--heading)}
.trk .meta{color:var(--muted);font-size:var(--small);margin-top:4px}
.choice{display:block;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:8px;cursor:pointer;background:var(--input-bg)}
.choice.sel{border-color:var(--primary);box-shadow:0 0 0 3px var(--focus-ring)}
.choice.dis{opacity:.55;cursor:default}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice .top{display:flex;justify-content:space-between;gap:10px}
.choice strong{color:var(--heading)}
.gate{background:var(--soft);border-radius:var(--in-radius);padding:12px 14px;font-size:var(--small);margin:4px 0 12px}
.linkrow{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.changes{margin:0;padding-left:20px;text-align:left}
.changes li{margin-bottom:6px}
/* return confirmation page (wide, two columns) */
body.wide .shell{max-width:min(1080px,100%)}
body.wide.lay-split .formside{padding:var(--page-pad)}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.dhead h1{margin:0}
.dgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.dp{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--input-bg);padding:22px 24px}
.dp h2{font-size:calc(var(--fs) * 1.25);margin:0 0 8px;color:var(--heading)}
.dp h3{font-size:var(--fs);margin:0 0 10px;color:var(--heading);font-weight:700}
.dp .sm{font-size:calc(var(--small) * .92);color:var(--muted)}
.dp p{margin:0 0 14px}
.dp ol{margin:0;padding-left:20px}.dp ol li{margin-bottom:7px}
.dp hr{border:0;border-top:1px solid var(--border);margin:18px 0}
.dlink{display:inline-block;margin-top:14px;font-weight:600}
.dmail{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:var(--small);color:var(--muted)}
.dmail .ic{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;flex:none;color:var(--muted)}
.dp details>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;color:var(--heading)}
.dp details>summary::-webkit-details-marker{display:none}
.dp details>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
.dp details[open]>summary::after{transform:rotate(-135deg)}
.dp details[open]>summary{margin-bottom:14px}
.dtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.dtile .im{aspect-ratio:1;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card-bg);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-weight:700;font-size:24px}
.dtile .im img{width:100%;height:100%;object-fit:contain}
.dtile .t{font-weight:600;color:var(--heading);font-size:var(--small);margin-top:8px;line-height:1.3}
.dtile .v{color:var(--muted);font-size:calc(var(--small) * .92)}
.dtile .p{text-align:right;font-size:var(--small);color:var(--heading);margin-top:2px}
.dsum{display:flex;justify-content:space-between;gap:10px;font-size:var(--small);padding:4px 0;color:var(--text)}
.dsum.b{font-weight:700;color:var(--heading)}
.dsitem{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;padding:6px 0;font-size:var(--small)}
.dsitem img,.dsitem .ph{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--soft)}
.dsitem .ph{display:grid;place-items:center;color:var(--muted);font-weight:700}
.dtotal{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:14px;margin-top:10px;border-top:1px solid var(--border)}
.dtotal .l{font-weight:700;color:var(--heading)}.dtotal .l span{display:block;font-weight:400;font-size:calc(var(--small) * .9);color:var(--muted)}
.dtotal .a{font-size:calc(var(--fs) * 1.35);font-weight:700;color:var(--heading)}
.dsurvey{background:var(--soft);text-align:center}
.dsurvey .q{font-weight:600;color:var(--heading);margin:4px 0 10px}
.rate{display:flex;justify-content:center;gap:10px}
.rate button{width:38px;height:38px;border:1px solid var(--border);border-radius:6px;background:var(--input-bg);font:inherit;color:var(--heading);cursor:pointer}
.rate button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.rlab{display:flex;justify-content:space-between;max-width:250px;margin:6px auto 18px;font-size:calc(var(--small) * .82);color:var(--muted)}
.dsurvey textarea{min-height:64px;margin-bottom:12px}
.dstatus{display:inline-block;font-size:calc(var(--small) * .9);font-weight:700;border-radius:999px;padding:3px 11px;background:var(--soft);color:var(--heading)}
.dcancel{margin-top:4px}
@media (max-width:860px){.dgrid{grid-template-columns:1fr}.dp{padding:18px}}
/* preview helpers (studio only) */
.previewflag{position:fixed;left:12px;bottom:12px;z-index:9;background:#111827;color:#fff;font:600 12px system-ui;padding:6px 10px;border-radius:8px;opacity:.85}
body.picking [data-sec]{cursor:pointer}
body.picking [data-sec]:hover{outline:2px dashed #3b6ef5;outline-offset:3px}
.flash{outline:3px solid #3b6ef5!important;outline-offset:4px;transition:outline-color .6s}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}

<style id="customcss"></style>
</head>
<body>
<div class="bg" data-sec="background"><div class="bg-img"></div><div class="bg-ov"></div></div>
<div class="announce hidden" id="announce" data-sec="announce"></div>
<header class="topbar hidden" id="topbar" data-sec="header"><div id="hdrBrand"></div><a id="hdrLink" href="#"></a></header>
<div class="page" id="page">
  <div class="media" data-sec="background"><div class="bg-img"></div><div class="bg-ov"></div></div>
  <div class="formside">
  <main class="shell">
    <div class="pagelogo hidden" id="pagelogo" data-sec="brand"></div>
    <div class="card" data-sec="layout">
      <div class="logowrap hidden" id="cardlogo" data-sec="brand"></div>
      <ol class="steps" id="steps" data-sec="layout"></ol>

      <section id="s1">
        <h1 id="t_lookup_title" data-sec="type"></h1>
        <div class="lead rich" id="t_lookup_sub"></div>
        <div id="e1" class="err hidden"></div>
        <form id="f1" novalidate>
          <div class="row"><label class="f" for="on" id="t_order_label"></label><input id="on" type="text" autocomplete="off" required data-sec="inputs"><div class="help" id="t_order_help"></div></div>
          <div class="row"><label class="f" for="em" id="t_email_label"></label><input id="em" type="email" autocomplete="email" required data-sec="inputs"></div>
          <button class="btn main" type="submit" id="b1" data-sec="buttons"></button>
        </form>
        <p class="muted rich" id="t_policy" style="margin:18px 0 0"></p>
      </section>

      <section id="s2" class="hidden">
        <h1 id="ordTitle"></h1>
        <p class="lead"><span id="t_items_sub"></span> <button class="linkbtn" onclick="startOver()" id="t_not_your_order"></button></p>
        <div id="existing"></div>
        <div id="e2" class="err hidden"></div>
        <div id="items" data-sec="items"></div>
        <div style="margin-top:22px"><button class="btn main" id="b2" disabled onclick="toStep3()" data-sec="buttons"></button></div>
        <div class="stepnav"><button class="btn2" onclick="back()">← <span data-copy="back"></span></button><button class="btn2 quiet" onclick="startOver()" data-copy="nav_start_over"></button></div>
      </section>

      <section id="s3" class="hidden">
        <h1 id="t_refund_title"></h1>
        <p class="lead" id="t_refund_sub"></p>
        <div id="opts"></div>
        <h2 class="label" id="t_address_title"></h2>
        <div class="box">
          <div id="addrView"></div>
          <button class="linkbtn" id="editAddr" style="margin-top:8px"></button>
          <div id="addrForm" class="hidden" style="margin-top:14px">
            <div class="row"><label class="f">Full name</label><input id="a_name" type="text" autocomplete="name"></div>
            <div class="row"><label class="f">Address</label><input id="a_1" type="text" autocomplete="address-line1"></div>
            <div class="row"><label class="f">Apt, suite (optional)</label><input id="a_2" type="text" autocomplete="address-line2"></div>
            <div class="grid2 row"><div><label class="f">City</label><input id="a_city" type="text" autocomplete="address-level2"></div><div><label class="f">State</label><input id="a_state" type="text" maxlength="2" placeholder="TX" autocomplete="address-level1"></div></div>
            <div class="grid2"><div><label class="f">ZIP</label><input id="a_zip" type="text" inputmode="numeric" autocomplete="postal-code"></div><div><label class="f">Phone</label><input id="a_phone" type="tel" autocomplete="tel"></div></div>
          </div>
        </div>
        <h2 class="label" id="t_summary_title"></h2>
        <div class="box" id="summary"></div>
        <div id="e3" class="err hidden" style="margin-top:16px"></div>
        <div style="margin-top:22px"><button class="btn main" id="b3" onclick="submitReturn()" data-sec="buttons"></button></div>
        <p class="muted" style="text-align:center;margin:10px 0 0" id="t_estimate_note"></p>
        <div class="stepnav"><button class="btn2" onclick="back()">← <span data-copy="back"></span></button><button class="btn2 quiet" onclick="startOver()" data-copy="nav_start_over"></button></div>
      </section>

      <section id="s4" class="hidden">
        <div class="dhead"><h1 id="doneTitle"></h1><span class="muted" id="doneRma"></span></div>
        <div class="dgrid"><div class="dcol" id="doneLeft"></div><div class="dcol" id="doneRight"></div></div>
        <div class="stepnav" style="justify-content:center;margin-top:22px"><button class="btn2" onclick="startOver()" data-copy="another_return"></button></div>
      </section>

      <section id="sMenu" class="hidden">
        <h1 id="menuTitle"></h1>
        <p class="lead"><span id="menuSub"></span> <button class="linkbtn" onclick="startOver()" data-copy="not_your_order"></button></p>
        <div id="menuExisting"></div>
        <div class="mopts" id="mopts" data-sec="items"></div>
        <div class="stepnav"><button class="btn2" onclick="back()">← <span data-copy="back"></span></button></div>
      </section>

      <section id="sEdit" class="hidden">
        <h1 id="editTitle">Edit your order</h1>
        <div id="eEditTop" class="err hidden"></div>
        <div id="editChanges">
          <p class="lead" id="editLead"></p>
          <h2 class="label" style="margin-top:0">Change a size</h2>
          <div id="editLines"></div>
          <h2 class="label">Shipping name &amp; address</h2>
          <div class="box">
            <div class="grid2 row"><div><label class="f">First name</label><input id="ed_first" type="text" autocomplete="given-name"></div><div><label class="f">Last name</label><input id="ed_last" type="text" autocomplete="family-name"></div></div>
            <div class="row"><label class="f">Address</label><input id="ed_1" type="text" autocomplete="address-line1"></div>
            <div class="row"><label class="f">Apt, suite (optional)</label><input id="ed_2" type="text" autocomplete="address-line2"></div>
            <div class="grid2 row"><div><label class="f">City</label><input id="ed_city" type="text" autocomplete="address-level2"></div><div><label class="f">State</label><input id="ed_state" type="text" maxlength="2" autocomplete="address-level1"></div></div>
            <div class="grid2"><div><label class="f">ZIP</label><input id="ed_zip" type="text" inputmode="numeric" autocomplete="postal-code"></div><div><label class="f">Phone</label><input id="ed_phone" type="tel" autocomplete="tel"></div></div>
          </div>
          <h2 class="label">Summary</h2>
          <div class="box" id="editSum"></div>
          <div id="eEdit" class="err hidden" style="margin-top:16px"></div>
          <div style="margin-top:22px"><button class="btn main" id="bEdit" onclick="submitEdit()" data-sec="buttons">Save changes</button></div>
        </div>
        <div id="editClosed" class="note hidden"></div>
        <h2 class="label">Cancel my order</h2>
        <div class="box" id="cancelBox">
          <div class="muted" style="margin-bottom:10px">You can cancel any time before your order ships. You’ll get a full refund to your original payment.</div>
          <div id="cancelAsk"><button class="btn2" onclick="$('cancelAsk').classList.add('hidden');$('cancelConfirm').classList.remove('hidden')">Cancel my order</button></div>
          <div id="cancelConfirm" class="hidden">
            <label class="f" for="cancelWhy">Mind telling us why? (optional)</label>
            <textarea id="cancelWhy" rows="2" placeholder="e.g. Ordered the wrong item"></textarea>
            <div id="eCancel" class="err hidden" style="margin-top:12px"></div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn sm" id="bCancel" onclick="submitCancel()">Yes, cancel my order</button><button class="btn2" onclick="$('cancelConfirm').classList.add('hidden');$('cancelAsk').classList.remove('hidden')">Keep my order</button></div>
          </div>
        </div>
        <div class="stepnav"><button class="btn2" onclick="back()">← <span data-copy="back"></span></button><button class="btn2 quiet" onclick="startOver()" data-copy="nav_start_over"></button></div>
      </section>

      <section id="sClaim" class="hidden">
        <div id="claimBody"></div>
        <div id="eClaim" class="err hidden" style="margin-top:16px"></div>
        <div id="claimSubmitWrap" style="margin-top:22px"><button class="btn main" id="bClaim" onclick="submitClaim()" data-sec="buttons">Submit claim</button></div>
        <div class="stepnav"><button class="btn2" onclick="back()">← <span data-copy="back"></span></button><button class="btn2 quiet" onclick="startOver()" data-copy="nav_start_over"></button></div>
      </section>

      <section id="sDone2" class="hidden done">
        <div class="check">✓</div>
        <h1 id="d2Title"></h1>
        <p class="lead" id="d2Sub"></p>
        <div id="d2Body"></div>
        <div class="stepnav" style="justify-content:center"><button class="btn2" onclick="go('sMenu')">← Back to my order</button><button class="btn2 quiet" onclick="startOver()" data-copy="nav_start_over"></button></div>
      </section>
    </div>
    <footer class="foot" id="foot" data-sec="footer"></footer>
  </main>
  </div>
</div>

<script>
const B = window.__BOOT__;          // { store, ctx, theme, preview }
let T = B.theme;                    // the active theme (published, or the draft in preview)
const CTX = B.ctx;                  // { name, support, prefix, shop_url, days, fee, bonus, credit_enabled, fee_on_credit }
let S = {}, method = 'original', addr = null, STEP = 1, PICK = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const money = (n) => '$' + (Math.round(n * 100) / 100).toFixed(2);
const SERIF = ['Playfair Display','Lora','Merriweather','Cormorant Garamond','Libre Baskerville','EB Garamond','Fraunces','DM Serif Display','Crimson Pro','Josefin Slab','Abril Fatface'];
const SCRIPT = ['Amatic SC','Caveat','Dancing Script','Pacifico'];
const fontStack = (f) => f === 'System' ? 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif' : `"${f}",${SERIF.includes(f) ? 'Georgia,serif' : SCRIPT.includes(f) ? 'cursive' : 'system-ui,-apple-system,"Segoe UI",sans-serif'}`;

/* ---------- copy: tokens + light formatting (**bold**, *italic*, [text](url), new lines) ---------- */
function tok(s, extra) {
  const v = { store: CTX.name, support: CTX.support, prefix: CTX.prefix, days: CTX.days, fee: money(CTX.fee || 0), bonus: CTX.bonus, ...(extra || {}) };
  return String(s == null ? '' : s).replace(/\{(\w+)\}/g, (m, k) => (v[k] != null ? v[k] : m));
}
function rich(s, extra, noLinks) {
  let h = esc(tok(s, extra));
  const links = [];
  // [text](url) first, parked as placeholders so the email auto-linker can't nest a link inside a link
  h = h.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:|\/(?!\/))[^)\s]+)\)/g, (m, t, u) => { links.push(noLinks ? t : `<a href="${u}" target="_blank" rel="noopener">${t}</a>`); return `\u0000${links.length - 1}\u0000`; });
  if (!noLinks) h = h.replace(/(^|[\s(>])([\w.+-]+@(?:[\w-]+\.)+\w+)/g, '$1<a href="mailto:$2">$2</a>');
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  h = h.replace(/\u0000(\d+)\u0000/g, (m, i) => links[Number(i)]);
  return h.replace(/\n/g, '<br>');
}
const C = (k, extra) => tok(T.copy[k], extra);

/* ---------- theme → page ---------- */
function rgba(hex, a) {
  let h = String(hex || '#000').replace('#', '');
  if (h.length === 3) h = h.split('').map((x) => x + x).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
const SHADOWS = { none: 'none', soft: '0 10px 30px -12px rgba(16,24,40,.18)', medium: '0 16px 40px -14px rgba(16,24,40,.28)', strong: '0 24px 60px -16px rgba(16,24,40,.45)' };
const imgUrl = (u) => (u ? `url("${String(u).replace(/"/g, '%22')}")` : 'none');
function applyTheme(t) {
  T = t;
  const r = document.documentElement.style, set = (k, v) => r.setProperty(k, String(v));
  const c = t.colors, ty = t.type, L = t.layout, bg = t.background, bt = t.buttons, inp = t.inputs, it = t.items;
  // colors
  set('--primary', c.primary); set('--on-primary', c.on_primary); set('--heading', c.heading); set('--text', c.text); set('--muted', c.muted); set('--link', c.link);
  set('--border', c.border); set('--soft', c.soft); set('--input-bg', c.input_bg); set('--input-text', c.input_text); set('--input-border', c.input_border);
  set('--focus', c.focus); set('--focus-ring', rgba(c.focus, 0.18)); set('--error', c.error); set('--error-bg', c.error_bg); set('--success', c.success);
  set('--badge-bg', c.badge_bg); set('--badge-text', c.badge_text); set('--page-text', c.page_text);
  set('--card-bg', rgba(c.card, L.card_opacity / 100));
  // type
  set('--heading-font', fontStack(ty.heading_font)); set('--body-font', fontStack(ty.body_font)); set('--heading-weight', ty.heading_weight); set('--body-weight', ty.body_weight);
  set('--h1-d', ty.h1_d + 'px'); set('--h1-m', ty.h1_m + 'px'); set('--h2-d', ty.h2_d + 'px'); set('--h2-m', ty.h2_m + 'px');
  set('--body-d', ty.body_d + 'px'); set('--body-m', ty.body_m + 'px'); set('--small-d', ty.small_d + 'px'); set('--small-m', ty.small_m + 'px');
  set('--lh', ty.line_height); set('--heading-tracking', ty.heading_tracking / 100 + 'em'); set('--heading-case', ty.heading_case); set('--label-case', ty.label_case);
  // layout
  set('--card-w', (L.style === 'split' ? 520 : L.card_w_d) + 'px'); set('--card-pad-d', L.card_pad_d + 'px'); set('--card-pad-m', L.card_pad_m + 'px');
  set('--page-pad-d', L.page_pad_d + 'px'); set('--page-pad-m', L.page_pad_m + 'px'); set('--radius', L.radius + 'px'); set('--radius-sm', Math.min(L.radius, 14) + 'px');
  set('--shadow', SHADOWS[L.shadow] || 'none'); set('--card-border', L.border_w + 'px'); set('--glass', L.glass_blur + 'px'); set('--split-w', L.split_w + '%');
  // background
  set('--bg-color', bg.color); set('--grad-from', bg.grad_from); set('--grad-to', bg.grad_to); set('--grad-angle', bg.grad_angle + 'deg');
  set('--bg-img-d', imgUrl(bg.image_d)); set('--bg-img-m', imgUrl(bg.image_m || bg.image_d)); set('--focal', `${bg.focal_x}% ${bg.focal_y}%`);
  set('--bg-fit', bg.fit === 'contain' ? 'contain' : 'cover'); set('--bg-blur', bg.blur + 'px'); set('--ov', rgba(bg.overlay, bg.overlay_opacity / 100));
  // brand
  set('--logo-h-d', t.brand.logo_h_d + 'px'); set('--logo-h-m', t.brand.logo_h_m + 'px'); set('--logo-justify', t.brand.logo_align === 'left' ? 'flex-start' : 'center');
  // buttons / inputs / items
  set('--btn-h-d', bt.height_d + 'px'); set('--btn-h-m', bt.height_m + 'px'); set('--btn-radius', bt.radius + 'px'); set('--btn-fs', bt.font_size + 'px');
  set('--btn-weight', bt.weight); set('--btn-case', bt.case); set('--btn-tracking', bt.tracking / 100 + 'em');
  set('--in-radius', inp.radius + 'px'); set('--in-h', inp.height + 'px'); set('--in-bw', inp.border_w + 'px');
  set('--img-size', it.image_size + 'px'); set('--img-col', it.image_size + 'px'); set('--img-radius', it.image_radius + 'px');
  // header / announcement
  set('--hdr-bg', t.header.bg); set('--hdr-text', t.header.text); set('--ann-bg', t.announce.bg); set('--ann-color', t.announce.color);

  // body classes (layout switches)
  const cls = ['lay-' + L.style, 'valign-' + L.valign, 'mode-' + bg.mode, 'fit-' + bg.fit, bg.attach === 'scroll' ? 'bg-scroll' : 'bg-fixed',
    'btn-' + bt.style, 'in-' + inp.style, 'logo-' + t.brand.logo_place];
  if (bt.full_width) cls.push('btn-full'); if (bt.shadow) cls.push('btn-shadow');
  if (L.card_full_m) cls.push('card-full-m'); if (!it.show_images) cls.push('noimg');
  if (t.header.show) cls.push('hdr-on'); if (t.header.sticky) cls.push('hdr-sticky'); if (t.header.border) cls.push('hdr-border');
  if (L.style === 'split') cls.push('split-' + (L.split_side || 'left'));
  if (PICK) cls.push('picking');
  if (STEP === 4) cls.push('wide');
  document.body.className = cls.join(' ');

  // fonts
  // one stylesheet per family, with only the weights that family has (Google rejects unknown weights)
  [...new Set([ty.heading_font, ty.body_font])].filter((f) => f !== 'System').forEach(loadFont);
  $('customcss').textContent = t.advanced.css || '';
  renderChrome();
  renderCopy();
  if (S.items) { renderItems(); if (STEP === 3) renderOpts(); }
  if (STEP === 4 && S.done) renderDone();
}

const FONT_LINKS = {};
function loadFont(f) {
  if (FONT_LINKS[f]) return;
  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(f).replace(/%20/g, '+') + ':wght@' + ((B.fonts && B.fonts[f]) || '400;700') + '&display=swap';
  document.head.appendChild(l); FONT_LINKS[f] = l;
}
function logoHtml() {
  const b = T.brand;
  const inner = b.logo ? `<img class="logo" src="${esc(b.logo)}" alt="${esc(tok(b.logo_alt))}">` : `<span class="storename">${esc(CTX.name)}</span>`;
  const name = b.logo && b.show_name ? `<span class="storename" style="margin-left:10px">${esc(CTX.name)}</span>` : '';
  const act = b.logo_action || 'start';
  if (act === 'shop' && b.logo_link) return `<a href="${esc(b.logo_link)}" style="align-items:center;text-decoration:none">${inner}${name}</a>`;
  if (act === 'start') return `<button type="button" class="logobtn" onclick="startOver()" title="${esc(C('nav_start_over'))}">${inner}${name}</button>`;
  return `<span style="display:inline-flex;align-items:center">${inner}${name}</span>`;
}
function renderChrome() {
  const place = T.brand.logo_place;
  $('cardlogo').classList.toggle('hidden', place !== 'card'); $('cardlogo').innerHTML = place === 'card' ? logoHtml() : '';
  $('pagelogo').classList.toggle('hidden', place !== 'page'); $('pagelogo').innerHTML = place === 'page' ? logoHtml() : '';
  const hdrOn = T.header.show || place === 'header';
  $('topbar').classList.toggle('hidden', !hdrOn);
  $('hdrBrand').innerHTML = place === 'header' ? logoHtml() : `<span class="brandname">${esc(CTX.name)}</span>`;
  const link = T.header.show_link && (T.brand.logo_link || CTX.shop_url);
  $('hdrLink').classList.toggle('hidden', !link); $('hdrLink').href = link || '#'; $('hdrLink').textContent = T.header.link_label || '';
  const a = T.announce;
  $('announce').classList.toggle('hidden', !(a.on && a.text));
  $('announce').innerHTML = a.on && a.text ? (a.link ? `<a href="${esc(a.link)}">${rich(a.text, null, true)}</a>` : rich(a.text)) : '';
  const f = T.footer;
  $('foot').classList.toggle('hidden', !f.show);
  const shop = T.brand.logo_link || CTX.shop_url;
  const shopLink = f.show_shop_link && shop ? `<div><a class="shoplink" href="${esc(shop)}">← ${esc(C('nav_shop'))}</a></div>` : '';
  $('foot').classList.toggle('hidden', !f.show && !shopLink);
  const faq = CTX.faq_url ? `<div style="margin-bottom:6px"><a href="${esc(CTX.faq_url)}" target="_blank" rel="noopener">FAQs</a></div>` : '';
  $('foot').classList.toggle('hidden', !f.show && !shopLink && !faq);
  $('foot').innerHTML = shopLink + faq + (f.show ? `<div class="rich">${rich(f.text)}</div>${f.links.length ? `<div class="links">${f.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}</div>` : ''}` : '');
  // steps
  $('steps').classList.toggle('hidden', !T.layout.steps || typeof STEP !== 'number' || STEP === 4);
  $('steps').innerHTML = [1, 2, 3, 4].map((n) => `<li class="${n < STEP ? 'past' : n === STEP ? 'on' : ''}"><span>${esc(C('step' + n))}</span></li>`).join('');
  // chrome height so a centered card centers in what's left of the screen
  const h = ($('announce').offsetHeight || 0) + (hdrOn ? $('topbar').offsetHeight || 0 : 0);
  document.documentElement.style.setProperty('--chrome-h', h + 'px');
}
function renderCopy() {
  const txt = (id, k) => { const el = $('t_' + id); if (el) el.textContent = C(k || id); };
  const html = (id, k) => { const el = $('t_' + id); if (el) el.innerHTML = rich(T.copy[k || id]); };
  txt('lookup_title'); html('lookup_sub'); txt('order_label'); txt('order_help'); txt('email_label'); html('policy');
  $('on').placeholder = C('order_placeholder'); $('em').placeholder = C('email_placeholder');
  $('t_order_help').classList.toggle('hidden', !T.copy.order_help);
  if (!$('b1').disabled) $('b1').textContent = C('lookup_button');
  txt('items_sub'); txt('not_your_order'); if (!$('b2').dataset.busy) $('b2').textContent = C('continue');
  document.querySelectorAll('[data-copy]').forEach((el) => { el.textContent = C(el.dataset.copy); });
  txt('refund_title'); txt('refund_sub'); txt('address_title'); txt('summary_title'); txt('estimate_note');
  $('editAddr').textContent = C('edit_address'); if (!$('b3').disabled) $('b3').textContent = C('submit');
  if (S.order) $('ordTitle').textContent = C('items_title', { order: S.order.name });
  document.title = tok(T.meta.title);
}

/* ---------- flow ---------- */
// Each step is a browser history entry, so the phone's back gesture / browser Back moves one step back.

  document.body.classList.toggle('wide', id === 's4');
  if (id === 'sMenu' && S.order) renderMenu();

  if (!B.preview && !fromHistory) {

  if (STEP === 'sDone2') { S.done2 = null; go('sMenu'); return; }   // after an edit/claim, Back lands on the menu (fresh)
  if (n !== 1 && !S.items) n = 1;
  if (n === 'sEdit' && !ED) n = 'sMenu';
  if ((n === 'sClaim' && !CL) || n === 'sDone2') n = 'sMenu';

function showErr(id, msg) { const e = $(id); e.textContent = msg || ''; e.classList.toggle('hidden', !msg); }

// Label fee: weight-based by default — a live ShipStation quote for the picked items + the customer's address.
const Q = { fee: null, token: null, key: '', loading: false, seq: 0 };
const weightMode = () => S.options && S.options.fee_mode !== 'flat' && !S.options.fee_waived && !B.preview;
function labelFee() { const o = S.options; if (o.fee_waived) return 0; if (!weightMode()) return Number(o.label_fee) || 0; return Q.fee == null ? null : Q.fee; }
function quoteKey() { const a = readAddr() || {}; return JSON.stringify([selectedLines().map((l) => [l.fulfillmentLineItemId, l.quantity]), a.address1 || '', a.zip || '']); }
async function fetchQuote() {
  if (!weightMode()) return true;
  const a = readAddr(), key = quoteKey();

function shrink(file) {
